name: Tests

on:
  push:
    branches: [master, 'jpr5/*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  otc-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/otc
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install locked producer dependencies
        run: |
          python -m pip install uv==0.10.7
          uv sync --frozen

      # The pinned real-data publication proof runs separately. These repository
      # fixtures exercise the producer's fallback validation and retention paths.
      - name: Run producer regression tests
        run: >-
          uv run --frozen python -m pytest -q -ra
          tests/test_release_writer.py
          tests/test_ticon_sets.py
          tests/test_chs_identities.py
          tests/test_combine.py
          tests/test_country_resolutions.py
          tests/test_format_1_0.py
          tests/test_gesla_build.py
          tests/test_original_metadata.py
          tests/test_source_inventory.py
          tests/test_station_map.py
          tests/test_station_map_r3.py

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@6aaa311d81eba98ae12eaffbcb63296ace0efcde # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Create cache directory
        run: mkdir -p cache

      - name: Run tests
        run: bundle exec rspec --format documentation
        env:
          RACK_ENV: test

      - name: Archive coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
