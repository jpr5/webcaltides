[project]
name = "gesla"
version = "0.1.0"
description = "GESLA fit pipeline for webcaltides: TCD table, records, QC and harmonic fit"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gesla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
