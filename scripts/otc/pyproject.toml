[project]
name = "otc-pipeline"
version = "0.1.0"
description = "OpenTideConstants release pipeline: release writer and validator, source adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema[format-nongpl]==4.25.1",
]

[project.optional-dependencies]
parquet = ["pyarrow==21.0.0"]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pyarrow==21.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otc_pipeline"]

# The schema copy lives in scripts/otc/schema/ (sync_schema.sh); a wheel carries it inside the
# package, where default_schema_path() looks first.
[tool.hatch.build.targets.wheel.force-include]
"schema/otc-0.2.schema.json" = "otc_pipeline/schema/otc-0.2.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
